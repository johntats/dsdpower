<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · CEPALCO Collection Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="auth.js"></script>
</head>
<body>
    <div class="login">
        <aside class="login-art" aria-hidden="true">
            <div class="txt">
                <h2>Collection Monitoring Update System</h2>
                <p>Billing &amp; Collection Department</p>
            </div>
        </aside>
        <main class="login-form">
            <form id="f" class="login-box">
                <img class="logo" src="cepalco-logo.png" alt="CEPALCO – Cagayan Electric Power &amp; Light Company, Inc.">
                <h1>Sign in</h1>
                <p class="sub">Use your CEPALCO monitoring account</p>
                <label>Username
                    <input id="u" autocomplete="username" required></label>
                <label>Password
                    <input id="p" type="password" autocomplete="current-password" required></label>
                <p id="e" class="err" hidden>Wrong username or password.</p>
                <button class="btn pri">Sign in</button>
                <div class="or">or</div>
                <button type="button" id="g" class="btn">Continue as guest</button>
                <p class="sub" style="text-align:center;margin:16px 0 0">Guests can view Collections and Accounts only.</p>
            </form>
        </main>
    </div>
<script>
const nxt=(()=>{const n=new URLSearchParams(location.search).get('next')||'';return /^[\w.-]+\.html(#\w+)?$/.test(n)?n:'index.html'})();
const E=document.getElementById('e');
document.getElementById('f').onsubmit=async e=>{e.preventDefault();E.hidden=true;const r=await Auth.login(document.getElementById('u').value,document.getElementById('p').value);
if(r===true)location.href=nxt;else{E.textContent=r;E.hidden=false}};
document.getElementById('g').onclick=async()=>{E.hidden=true;const r=await Auth.guest();if(r===true)location.href='index.html';else{E.textContent=r;E.hidden=false}};
</script>
</body>
</html>
