<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · CEPALCO Collection Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="auth.js"></script>
    <style>body{background:#eef1f5;font-family:'Inter',system-ui,sans-serif}input:focus{outline:2px solid #2563eb;outline-offset:1px}</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center gap-3">
            <div class="bg-yellow-400 p-2.5 rounded-lg text-blue-900 font-black tracking-wider text-xl">CEPALCO</div>
            <div><h1 class="text-lg font-bold tracking-tight">Collection Monitoring Update System</h1>
            <p class="text-xs text-blue-200">Billing &amp; Collection Department • Sign in</p></div>
        </div>
    </header>
    <main class="max-w-sm mx-auto px-4 py-12">
        <form id="f" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="font-bold text-base">Sign in</h2>
            <label class="block text-sm font-semibold text-slate-700">Username
                <input id="u" autocomplete="username" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></label>
            <label class="block text-sm font-semibold text-slate-700">Password
                <input id="p" type="password" autocomplete="current-password" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></label>
            <p id="e" class="text-sm text-red-600" hidden>Wrong username or password.</p>
            <button class="w-full bg-blue-900 text-white font-semibold rounded-lg py-2 text-sm hover:bg-blue-800">Sign in</button>
            <div class="text-center text-xs text-slate-400">or</div>
            <button type="button" id="g" class="w-full border border-slate-300 text-slate-700 font-semibold rounded-lg py-2 text-sm hover:bg-slate-50">Continue as guest</button>
            <p class="text-xs text-slate-500 text-center">Guests can view Collections and Accounts only.</p>
        </form>
    </main>
<script>
const nxt=(()=>{const n=new URLSearchParams(location.search).get('next')||'';return /^[\w.-]+\.html(#\w+)?$/.test(n)?n:'index.html'})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const ok=await Auth.login(document.getElementById('u').value,document.getElementById('p').value);
if(ok)location.href=nxt;else document.getElementById('e').hidden=false};
document.getElementById('g').onclick=()=>{Auth.guest();location.href='index.html'};
</script>
</body>
</html>
